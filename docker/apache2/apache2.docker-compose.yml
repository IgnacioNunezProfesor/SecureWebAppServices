services:
  http:
    image: ${DOCKER_IMAGE_NAME}
    container_name: ${DOCKER_CONTAINER_NAME}
    build:
      context: ..\..
      dockerfile: ${DOCKERFILE}
      args:
        - HTTP_APACHE2_LOCAL_CONF_DIR=${HTTP_APACHE2_LOCAL_CONF_DIR}
        - HTTP_APACHE2_LOCAL_CONFD_DIR=${HTTP_APACHE2_LOCAL_CONFD_DIR}
        - HTTP_APACHE2_SERVER_CONF_DIR=${HTTP_APACHE2_SERVER_CONF_DIR}
        - HTTP_APACHE2_SERVER_CONFD_DIR=${HTTP_APACHE2_SERVER_CONFD_DIR}
        - HTTP_APACHE2_SERVER_PORT=${HTTP_APACHE2_SERVER_PORT}
        - HTTP_APACHE2_LOCAL_PORT=${HTTP_APACHE2_LOCAL_PORT}
        - HTTP_APACHE2_LOCAL_DEFAULT_FOLDER=${HTTP_APACHE2_LOCAL_DEFAULT_FOLDER}
        - HTTP_APACHE2_SERVER_DEFAULT_FOLDER=${HTTP_APACHE2_SERVER_DEFAULT_FOLDER}
    restart: always
    ports:
      - "${HTTP_APACHE2_LOCAL_PORT}:${HTTP_APACHE2_SERVER_PORT}"
    networks:
      - MyNet
    environment:
      - HTTP_APACHE2_LOCAL_CONF_DIR=${HTTP_APACHE2_LOCAL_CONF_DIR}
      - HTTP_APACHE2_LOCAL_CONFD_DIR=${HTTP_APACHE2_LOCAL_CONFD_DIR}
      - HTTP_APACHE2_SERVER_CONF_DIR=${HTTP_APACHE2_SERVER_CONF_DIR}
      - HTTP_APACHE2_SERVER_CONFD_DIR=${HTTP_APACHE2_SERVER_CONFD_DIR}
      - HTTP_APACHE2_SERVER_PORT=${HTTP_APACHE2_SERVER_PORT}
      - HTTP_APACHE2_LOCAL_PORT=${HTTP_APACHE2_LOCAL_PORT}
      - HTTP_APACHE2_LOCAL_DEFAULT_FOLDER=${HTTP_APACHE2_LOCAL_DEFAULT_FOLDER}
      - HTTP_APACHE2_SERVER_DEFAULT_FOLDER=${HTTP_APACHE2_SERVER_DEFAULT_FOLDER}
      - HTTP_APACHE2_SERVER_NAME=${HTTP_APACHE2_SERVER_NAME}
      - NETWORK_NAME=${NETWORK_NAME}
      - NETWORK_DRIVER=${NETWORK_DRIVER}
      - NETWORK_SUBNET=${NETWORK_SUBNET}
      - NETWORK_SUBNET_GATEWAY=${NETWORK_SUBNET_GATEWAY}
    volumes:
      - ${HTTP_APACHE2_LOCAL_DEFAULT_FOLDER}:${HTTP_APACHE2_SERVER_DEFAULT_FOLDER}
      - ${HTTP_LOCAL_LOG_PATH}:${HTTP_SERVER_LOG_PATH}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", 
        "curl", 
        "-f", 
        "http://${HTTP_APACHE2_SERVER_NAME}:${HTTP_APACHE2_SERVER_PORT}/server-status"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  MyNet:
    name: ${NETWORK_NAME}
    driver: ${NETWORK_DRIVER}
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
          gateway: ${NETWORK_SUBNET_GATEWAY}
