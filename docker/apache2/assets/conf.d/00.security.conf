# ============================
#  Seguridad básica del servidor
# ============================

# Evitar que el navegador interprete tipos MIME incorrectos
Header always set X-Content-Type-Options "nosniff"

# Evitar que el sitio se incruste en iframes (clickjacking)
Header always set X-Frame-Options "SAMEORIGIN"

# Activar protección XSS del navegador
Header always set X-XSS-Protection "1; mode=block"

# Política de Referer más estricta
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Desactivar ServerSignature y ServerTokens para ocultar versión del servidor
ServerSignature Off
ServerTokens Prod

# ============================
#  HSTS (solo si usas HTTPS)
# ============================
# Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

# ============================
#  Protección contra métodos peligrosos
# ============================
<LimitExcept GET POST HEAD>
    Require all denied
</LimitExcept>

# ============================
#  Desactivar TRACE (vulnerabilidad XST)
# ============================
TraceEnable Off

# ============================
#  Evitar listado de directorios
# ============================
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
</Directory>

# ============================
#  CORS (opcional, si lo necesitas)
# ============================
Header always set Access-Control-Allow-Origin "*"
Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
Header always set Access-Control-Allow-Headers "Content-Type"
